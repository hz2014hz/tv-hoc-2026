<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiếng Việt học</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
  <main>
    <header>
      <h1>Tiếng Việt học</h1>
      <p class="tagline">Word catalog · Wörterverzeichnis</p>
    </header>

    <div class="controls">
      <input id="search" type="search" placeholder="Search Vietnamese, English or Deutsch…" autocomplete="off" spellcheck="false">
      <div class="filter-row">
        <div id="lesson-filter" class="pills"></div>
        <span id="count" class="count"></span>
      </div>
      <p class="hint">Accents are optional: <code>dat</code> finds <em>đắt</em>, <code>ca phe</code> finds <em>cà phê</em>.</p>
    </div>

    <div id="results"></div>
  </main>

  <script src="data.js?v=dev"></script>
  <script src="app.js?v=dev"></script>
</body>
</html>
